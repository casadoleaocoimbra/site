;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; .user.ini – Configurações PHP 8.2 (produção)
; Casa do Leão Coimbra – Pagamentos Easypay
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; =============== GERAIS =======================
default_charset = UTF-8
date.timezone = Europe/Lisbon
expose_php = Off
engine = On
short_open_tag = Off

; =============== ERROS ========================
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /home/casad128/logs/php_errors.log
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED
html_errors = Off

; =============== DESEMPENHO ===================
zlib.output_compression = On
output_buffering = 4096
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; =============== ARQUIVOS =====================
upload_max_filesize = 20M
post_max_size = 20M
max_input_time = 60
max_execution_time = 60
memory_limit = 256M

; =============== SESSÕES ======================
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_samesite = Strict

; =============== SEGURANÇA ====================
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source
file_uploads = On
open_basedir = /home/casad128:/tmp

; =============== ENCODING =====================
mbstring.internal_encoding = UTF-8
mbstring.http_input = UTF-8
mbstring.http_output = UTF-8

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; FIM DO FICHEIRO
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Substitua casad128 pelo seu nome de usuário real no servidor.